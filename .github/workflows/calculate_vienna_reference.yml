name: Calculate Vienna reference point

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install pandas odfpy

      - name: Inspect population table header
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          from urllib.request import urlretrieve

          REPORT = Path("docs/data/vienna_reference_test.json")

          population_url = (
              "https://www.statistik.at/fileadmin/pages/405/"
              "Bev_Zeitreihe_Jahresbeginn_Gebietseinheiten.ods"
          )

          ods_path = "/tmp/population.ods"
          urlretrieve(population_url, ods_path)

          df = pd.read_excel(
              ods_path,
              sheet_name="Insgesamt",
              engine="odf",
              header=None,
          )

          def clean_row(i):
              return {
                  "row": int(i),
                  "values": [
                      None if pd.isna(x) else str(x)
                      for x in df.iloc[i].tolist()
                  ],
              }

          header_rows = [
              clean_row(i)
              for i in range(min(15, len(df)))
          ]

          vienna_rows = []

          for i, row in df.iterrows():
              first = str(row.iloc[0]).strip()

              if first in {
                  str(x)
                  for x in range(901, 924)
              }:
                  vienna_rows.append(clean_row(i))

          report = {
              "sheet": "Insgesamt",
              "header_rows": header_rows,
              "vienna_district_count": len(vienna_rows),
              "vienna_rows": vienna_rows,
              "note": (
                  "Testlauf zur eindeutigen Identifikation "
                  "der Bevölkerungsspalte für 1.1.2025."
              ),
          }

          REPORT.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit test report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/vienna_reference_test.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Inspect Vienna population table header"
            git push
          fi
