name: Calculate Vienna reference point

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install pandas odfpy

      - name: Calculate Vienna population-weighted point
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          from urllib.request import urlretrieve
          from urllib.parse import urlencode
          from urllib.request import urlopen

          REPORT = Path("docs/data/vienna_reference_test.json")

          # 1) Offizielle Statistik-Austria-Bevölkerungstabelle
          population_url = (
              "https://www.statistik.at/fileadmin/pages/405/"
              "Bev_Zeitreihe_Jahresbeginn_Gebietseinheiten.ods"
          )

          ods_path = "/tmp/population.ods"
          urlretrieve(population_url, ods_path)

          # 2) Offizielle Statistik-Austria-Gemeindeschwerpunkte
          params = {
              "service": "WFS",
              "version": "1.0.0",
              "request": "GetFeature",
              "typeName": "GEODATA:STATISTIK_AUSTRIA_GEM_MP_20250101",
              "outputFormat": "application/json",
              "srsName": "EPSG:4326",
          }

          wfs_url = (
              "https://www.statistik.gv.at/gs-open/GEODATA/ows?"
              + urlencode(params)
          )

          with urlopen(wfs_url, timeout=120) as response:
              geo = json.load(response)

          district_points = {}

          for feature in geo.get("features", []):
              props = {
                  str(k).lower(): v
                  for k, v in feature.get("properties", {}).items()
              }

              gid = props.get("g_id")
              coords = (feature.get("geometry") or {}).get("coordinates")

              if gid is None or not coords:
                  continue

              gid = str(gid).strip()

              if gid.isdigit():
                  gid = gid.zfill(5)

              if gid.startswith("9") and gid != "90001":
                  district_points[gid] = {
                      "lon": float(coords[0]),
                      "lat": float(coords[1]),
                  }

          print("Wiener Schwerpunktpunkte:", len(district_points))

          # 3) ODS inspizieren und passende Tabelle automatisch suchen
          sheets = pd.read_excel(
              ods_path,
              sheet_name=None,
              engine="odf",
              header=None,
          )

          candidates = []

          for sheet_name, df in sheets.items():
              for row_index, row in df.iterrows():
                  text = " | ".join(
                      str(x)
                      for x in row.tolist()
                      if pd.notna(x)
                  )

                  if "Wien 1." in text or "Innere Stadt" in text:
                      candidates.append(
                          {
                              "sheet": sheet_name,
                              "row": int(row_index),
                              "text": text[:500],
                          }
                      )

          report = {
              "district_point_count": len(district_points),
              "population_table_candidates": candidates[:30],
              "note": (
                  "Testlauf: findet zuerst die Struktur der offiziellen "
                  "Bevölkerungstabelle. Noch keine produktiven Daten geändert."
              ),
          }

          REPORT.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit test report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/vienna_reference_test.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Test Vienna population reference point"
            git push
          fi
