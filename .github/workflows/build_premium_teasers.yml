
name: Build premium climate teasers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-data-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate monthly climate history
        run: python scripts/validate_monthly_history.py

      - name: Build premium climate teasers
        run: python scripts/build_premium_teasers.py

      - name: Commit premium teaser data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/data/temperature_grid/monthly/teasers \
            docs/data/precipitation/monthly/teasers \
            docs/data/snow/monthly/teasers

          if git diff --cached --quiet; then
            echo "No teaser changes."
            exit 0
          fi

          git commit -m "Build personalized premium climate teasers"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
