name: Temperature Grid Test

on:
  push:
    branches:
      - feature/temperature-grid
    paths:
      - "scripts/build_temperature_grid.py"
      - ".github/workflows/temperature-grid-test.yml"

jobs:
  build-wien:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Build Austria temperature grid climatology
        run: python scripts/build_temperature_grid.py --state all

      - name: Show generated files
        run: |
          ls -lh docs/data/temperature_grid
          ls -lh docs/data/temperature_grid/climatology
          
      - name: Upload temperature grid test data
        uses: actions/upload-artifact@v4
        with:
          name: temperature-grid-austria
          path: docs/data/temperature_grid/
