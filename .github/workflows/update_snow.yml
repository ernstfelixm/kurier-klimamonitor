name: Update current snow data

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: climate-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update current SNOWGRID data
        run: |
          python scripts/update_snow.py

      - name: Commit current snow data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/snow/current
          git add docs/data/snow/status.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Update current snow data"
          git pull --rebase origin main
          git push origin main
