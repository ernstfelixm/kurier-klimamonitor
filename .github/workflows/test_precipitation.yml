name: Test SPARTACUS precipitation

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build precipitation test data
        run: python scripts/test_precipitation.py

      - name: Commit test output
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/data/precipitation_test.json

          if git diff --cached --quiet
          then
            echo "No precipitation test changes."
          else
            git commit -m "Add SPARTACUS precipitation test data"
            git push
          fi
