name: Update GeoSphere temperature data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update existing GeoSphere temperature data
        id: geosphere_update
        continue-on-error: true
        run: python scripts/update.py

      - name: Update temperature grid data
        id: temperature_grid_update
        continue-on-error: true
        run: python scripts/update_temperature_grid.py

      - name: Commit changed data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/data/current \
            docs/data/status.json \
            docs/data/temperature_grid/current

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update GeoSphere temperature data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Mark workflow as failed when update failed
        if: steps.geosphere_update.outcome == 'failure' || steps.temperature_grid_update.outcome == 'failure'
        run: exit 1
