name: Update GeoSphere temperature data

on:
  schedule:
    # 12:30 UTC = 14:30 CEST / 13:30 CET.
    # A later run gives GeoSphere more time to publish the previous day's values.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update GeoSphere data
        id: geosphere_update
        continue-on-error: true
        run: python scripts/update.py

      - name: Commit changed data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/current docs/data/status.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update GeoSphere temperature data"
            git push
          fi

      - name: Mark workflow as failed when update failed
        if: steps.geosphere_update.outcome == 'failure'
        run: exit 1
