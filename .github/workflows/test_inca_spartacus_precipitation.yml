name: Test SPARTACUS vs INCA precipitation

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Erster Überlappungstag (YYYY-MM-DD)"
        required: false
        default: "2026-10-01"
      end:
        description: "Letzter Testtag (YYYY-MM-DD), leer = gestern"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run overlap test
        shell: bash
        run: |
          if [ -n "${{ inputs.end }}" ]; then
            python scripts/test_inca_spartacus_precipitation.py \
              --start "${{ inputs.start }}" \
              --end "${{ inputs.end }}"
          else
            python scripts/test_inca_spartacus_precipitation.py \
              --start "${{ inputs.start }}"
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: inca-spartacus-precipitation-test
          path: tmp/inca_overlap_test/
          if-no-files-found: error
