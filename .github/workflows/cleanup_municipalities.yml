name: Clean municipality base data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean municipality data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/municipalities.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          old_columns = data["columns"]
          keep = ["id", "name", "state", "lat", "lon"]
          indexes = [old_columns.index(column) for column in keep]

          data["columns"] = keep
          data["municipalities"] = [
              [row[index] for index in indexes]
              for row in data["municipalities"]
          ]
          data["count"] = len(data["municipalities"])

          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )
          PY

      - name: Commit cleaned municipality data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/municipalities.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Clean municipality base data"
            git push
          fi
