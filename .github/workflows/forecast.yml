name: Update GeoSphere temperature forecast

on:
  schedule:
    # Multiple early-morning backup slots. The Python script itself only
    # performs the GeoSphere fetch once the local Vienna time is >= 05:15,
    # and skips all later runs once today's complete forecast already exists.
    # This covers daylight saving time automatically:
    # - CEST: 03:15 UTC = 05:15 local
    # - CET:  04:15 UTC = 05:15 local
    - cron: "15 3 * * *"
    - cron: "15 4 * * *"
    - cron: "15 5 * * *"
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-forecast-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update GeoSphere forecast
        id: forecast_update
        continue-on-error: true
        run: python scripts/update_forecast.py

      - name: Commit forecast data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/forecast.json
          if git diff --cached --quiet; then
            echo "No forecast changes."
          else
            git commit -m "Update GeoSphere temperature forecast"
            git push
          fi

      - name: Mark workflow as failed when forecast update failed
        if: steps.forecast_update.outcome == 'failure'
        run: exit 1
