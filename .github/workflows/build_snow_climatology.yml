name: Build SNOWGRID climatology

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Bundesland oder ganz Österreich"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - burgenland
          - kaernten
          - niederoesterreich
          - oberoesterreich
          - salzburg
          - steiermark
          - tirol
          - vorarlberg
          - wien

permissions:
  contents: write

concurrency:
  group: climate-data-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build SNOWGRID climatology
        run: |
          python scripts/build_snow_climatology.py --state "${{ inputs.state }}"

      - name: Commit generated climatology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/snow/climatology
          git add docs/data/snow/build_status.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Build SNOWGRID climatology"
          git pull --rebase origin main
          git push origin main
