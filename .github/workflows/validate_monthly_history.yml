
name: Validate monthly climate history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate monthly climate data
        run: python scripts/validate_monthly_history.py

      - name: Publish quality report
        if: always()
        shell: bash
        run: |
          if [ -f monthly_quality_report.md ]; then
            cat monthly_quality_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-climate-quality-report
          path: |
            monthly_quality_report.md
            monthly_quality_report.json
          retention-days: 30
