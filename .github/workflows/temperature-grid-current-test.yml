name: Temperature Grid Current Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/temperature-grid
    paths:
      - "scripts/update_temperature_grid.py"
      - ".github/workflows/temperature-grid-current-test.yml"

jobs:
  update-current:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update recent SPARTACUS temperature grid data
        run: python scripts/update_temperature_grid.py

      - name: Show generated files
        run: |
          ls -lh docs/data/temperature_grid/current
          du -sh docs/data/temperature_grid/current

      - name: Commit temperature grid current data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/temperature_grid/current

          if git diff --cached --quiet; then
            echo "No temperature grid current changes."
          else
            git commit -m "Update temperature grid current data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
